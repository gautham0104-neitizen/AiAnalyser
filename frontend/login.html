<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Programmer Analyzer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">AI</div>

                <h1>AI Programmer Analyzer</h1>

                <p>
                    Understand your programming behavior.
                </p>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Login
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>
</html>
