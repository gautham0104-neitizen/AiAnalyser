<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | AI Programmer Analyzer</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">

                <div class="brand-icon">
                    AI
                </div>

                <h1>
                    Create your account
                </h1>

                <p>
                    Start building your programmer profile.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        minlength="3"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter your password again"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Account
                </button>

            </form>


            <div
                id="message"
                class="message"
            ></div>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>
</html>
